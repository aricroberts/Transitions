<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="grammarly-disable-extension" content="true"/>
<title>receipts. — Motivational Conversation</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css"/>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0F1117;--surface:#1A1D27;--surface2:#22263A;--border:#2A2F45;
  --text:#E8EAF0;--text2:#8A90A8;--text3:#4A5070;
  --blue:#4A9EFF;--blue-dim:#0A1830;--blue-b:#4A9EFF44;
  --green:#2ECC8A;--green-dim:#081C14;--green-b:#2ECC8A44;
  --amber:#F59E0B;--amber-dim:#1C1200;--amber-b:#F59E0B44;
  --red:#F0514F;--red-dim:#1C0808;--red-b:#F0514F44;
  --teal:#22D4C8;--teal-dim:#061C1A;--teal-b:#22D4C844;
  --purple:#9B8BF8;--purple-dim:#12102A;--purple-b:#9B8BF844;
  --radius:10px;--radius-sm:6px;
  font-family:'DM Sans',system-ui,sans-serif;
}
body{background:var(--bg);color:var(--text);min-height:100vh}
.app{max-width:920px;margin:0 auto;padding:1.25rem}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;padding-bottom:.875rem;border-bottom:1px solid var(--border);gap:1rem;flex-wrap:wrap}
.logo{font-size:15px;font-weight:600;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lab{font-size:9px;font-weight:400;letter-spacing:.05em;text-transform:uppercase;color:var(--text3)}
.version-badge,.privacy-pill{font-size:11px;padding:3px 9px;border-radius:99px;font-weight:500;border:1px solid}
.version-badge{background:var(--blue-dim);color:var(--blue);border-color:var(--blue-b)}
.privacy-pill{display:flex;align-items:center;gap:5px;color:var(--teal);background:var(--teal-dim);border-color:var(--teal-b);white-space:nowrap}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.125rem;margin-bottom:.875rem}
.card-ok{background:var(--green-dim);border-color:var(--green-b)}
.card-warn{background:var(--amber-dim);border-color:var(--amber-b)}
.card-ai{background:var(--purple-dim);border-color:var(--purple-b)}
.card-teal{background:var(--teal-dim);border-color:var(--teal-b)}
.card-pay{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem;text-align:center}
.sl{font-size:12px;font-weight:600;color:var(--text2);margin:0 0 10px;display:flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:.05em}
.sl-ok{color:var(--green)}.sl-warn{color:var(--amber)}.sl-ai{color:var(--purple)}.sl-teal{color:var(--teal)}.sl-blue{color:var(--blue)}
.lede{font-size:13px;line-height:1.65;color:var(--text2);max-width:760px}
.fg{display:flex;flex-direction:column;gap:3px}
.fg label{font-size:11px;font-weight:500;color:var(--text2);text-transform:uppercase;letter-spacing:.04em}
.fg input,.fg select,.fg textarea{width:100%;font-size:13px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 10px;color:var(--text);font-family:inherit}
.fg textarea{min-height:86px;resize:vertical;line-height:1.55}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--blue)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:.875rem}
.mc{background:var(--surface2);border-radius:var(--radius-sm);padding:10px 12px;min-height:76px}
.mc .lb{font-size:11px;color:var(--text3);margin:0 0 3px;text-transform:uppercase;letter-spacing:.04em}
.mc .vl{font-size:20px;font-weight:600;margin:0;font-family:'DM Mono',monospace}
.dpre{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;font-size:12px;line-height:1.7;white-space:pre-wrap;font-family:'DM Mono',monospace;max-height:240px;overflow-y:auto;color:var(--text)}
.brow{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.coach-mode{padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;height:auto;cursor:pointer;text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);transition:all .15s}
.coach-mode:hover{background:var(--surface2);border-color:var(--teal-b)}
.coach-mode i{font-size:18px}.coach-mode span:first-of-type{font-weight:500;font-size:13px}.coach-mode span:last-of-type{color:var(--text2);font-size:11px;line-height:1.35}
.cmsg{background:var(--surface2);border-radius:var(--radius-sm);padding:10px 12px;font-size:13px;line-height:1.7;color:var(--text);margin-bottom:6px;border:1px solid var(--border)}
.cmai{background:var(--green-dim);border-color:var(--green-b);color:#A0E8C8}
.spin{display:inline-block;width:11px;height:11px;border:2px solid var(--border);border-top-color:var(--text2);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-1px;margin-right:3px}
@keyframes sp{to{transform:rotate(360deg)}}
button{font-family:inherit;font-size:13px;padding:8px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);cursor:pointer;transition:all .15s}
button:hover{background:var(--surface2)}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.btn-primary:hover{background:#3a8eef}
.btn-teal{background:var(--teal);border-color:var(--teal);color:#061C1A;font-weight:600}
.btn-teal:hover{background:#1ab8ad}
.btn-green{background:var(--green);border-color:var(--green);color:#081C14;font-weight:600}
.btn-green:hover{background:#25b87a}
.resource-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.resource{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:.875rem 1rem;text-decoration:none;color:var(--text);display:block}
.resource:hover{border-color:var(--blue-b);background:var(--surface2)}
.resource strong{display:block;font-size:13px;font-weight:600;margin-bottom:3px}
.resource span{display:block;font-size:11px;color:var(--text3);line-height:1.4}
.week-item{background:var(--surface2);border:1px solid var(--green-b);border-radius:var(--radius-sm);padding:8px 12px;font-size:13px;color:var(--text);line-height:1.55;margin-bottom:5px}
.obstacle-item{background:var(--red-dim);border:1px solid var(--red-b);border-radius:var(--radius-sm);padding:8px 12px;font-size:13px;line-height:1.55;margin-bottom:5px}
.resource-item{display:block;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 12px;font-size:13px;color:var(--text);text-decoration:none;line-height:1.55;margin-bottom:5px;transition:border-color .15s}
.resource-item:hover{border-color:var(--blue-b)}
.section-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:.5rem;margin-top:1rem}
.price-big{font-size:28px;font-weight:700;font-family:'DM Mono',monospace;color:var(--text)}
.email-inp{width:100%;max-width:340px;display:block;margin:0 auto .75rem;font-size:13px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 12px;color:var(--text);font-family:inherit}
.email-inp:focus{outline:none;border-color:var(--blue)}
@media(max-width:680px){.g2,.resource-grid{grid-template-columns:1fr}.app{padding:1rem}.privacy-pill{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>

/* ── API routing ─────────────────────────────────────────────────────────────
 *  Inside claude.ai  → direct call, key auto-injected
 *  On deployed site  → goes through PROXY_URL (proxy-server.js on Render)
 * ─────────────────────────────────────────────────────────────────────────── */
var PROXY_URL = 'https://myvalue.onrender.com/api/messages';
var _DIRECT   = 'https://api.anthropic.com/v1/messages';

var _isWidget = (function() {
  try {
    var h = window.location.hostname || '';
    return h === 'claude.ai' || h.indexOf('.claude.ai') !== -1;
  } catch(e) { return false; }
})();

async function apiCall(payload) {
  var url = _isWidget ? _DIRECT : PROXY_URL;
  var headers = { 'Content-Type': 'application/json' };
  if (_isWidget) {
    headers['anthropic-version'] = '2023-06-01';
    headers['anthropic-dangerous-direct-browser-access'] = 'true';
  }
  var r = await fetch(url, { method: 'POST', headers: headers, body: JSON.stringify(payload) });
  if (!r.ok) {
    var eb = await r.json().catch(function(){ return {}; });
    var e = new Error('http ' + r.status);
    e.status = r.status; e.apiErr = eb.error || eb;
    throw e;
  }
  var d = await r.json();
  if (d.error) { var e2 = new Error('api'); e2.apiErr = d.error; throw e2; }
  return d;
}

/* ── STRIPE CONFIGURATION ────────────────────────────────────────────────────
 *
 *  Create one product in Stripe Dashboard:
 *    Product name: "receipts. Motivation Roadmap"
 *    Price: $10 one-time
 *    Success URL: https://receipts.aricciviclabs.org/motivation_coach.html?unlocked=plan
 *
 *  Then paste the Payment Link URL below.
 *
 * ─────────────────────────────────────────────────────────────────────────── */
var STRIPE_MC = {
  plan: 'https://buy.stripe.com/cNi3cwaQi4jg8TZ8W77N60r'
};

/* ── State ─────────────────────────────────────────────────────────────────── */
var _mcUnlocked  = false;   /* true after Stripe return */
var _coachTurns  = 0;       /* counts user sends in current session */
var _miniShown   = false;   /* true after mini preview generated */
var _roadmapDone = false;   /* true after full roadmap generated */
var _MC_SS_KEY   = 'rcpts_mc_unlocked';

window.COACH_KIND = 'motivation';

/* ── URL unlock detection + sessionStorage persistence ──────────────────────────────── */
(function() {
  try {
    var params = new URLSearchParams(window.location.search);
    var fromUrl = params.get('unlocked') === 'plan';
    var fromSS  = sessionStorage.getItem(_MC_SS_KEY) === '1';
    if (fromUrl || fromSS) {
      _mcUnlocked = true;
      try { sessionStorage.setItem(_MC_SS_KEY, '1'); } catch(e) {}
      try { window.history.replaceState({}, '', window.location.pathname); } catch(e) {}
    }
  } catch(e) {}
})();

/* ── Coach data ─────────────────────────────────────────────────────────────── */
var COACHES = {
motivation: {
  icon:'ti-sun-high', badge:'Motivational Conversation', title:'Motivational Conversation', tone:'card-ok',
  lede:'Turn whatever you\'re carrying into a useful next step — grounded in psychology, specific to your situation, and actually doable.',
  modes:[
    ['reframe','ti-refresh','Positive reframe','Turn the situation into a useful story'],
    ['stuck','ti-traffic-cone','Unstuck plan','Find the smallest next action'],
    ['confidence','ti-shield-check','Confidence builder','Build self-trust without hype'],
    ['energy','ti-battery-3','Energy reset','Motivation when tired or flat']
  ],
  resources:[
    ['Self-Determination Theory','Motivation improves when autonomy, competence, and relatedness are supported','https://selfdeterminationtheory.org/theory/'],
    ['APA Stress Resources','Psychology-backed stress and resilience articles','https://www.apa.org/topics/stress'],
    ['NIH Emotional Wellness Toolkit','Simple practices for emotional well-being','https://www.nih.gov/health-information/emotional-wellness-toolkit'],
    ['Mindset Kit','Growth mindset resources from Stanford-associated researchers','https://www.mindsetkit.org/']
  ],
  systems:{
    reframe:'You are a warm motivational psychology coach. Help the user turn anything they bring into a grounded positive — not fake optimism, but a useful reframe, a strength they are showing, and a next step. Ask ONE focused question at a time. Use cognitive reappraisal, self-compassion, and self-determination theory. Do not provide medical or therapy advice. After 3 exchanges, if you have enough, output 1-2 coaching sentences then on a new line exactly: COACH OUTPUT: followed by valid JSON with keys summary, positive_reframe, psychology_tip, next_step.',
    stuck:'You are a motivational action coach. Help the user move from stuck to the smallest honest next step. Ask ONE question at a time. Use behavioral activation, friction reduction, and tiny habits. Be encouraging but specific. Do not shame. After 3 exchanges, output 1-2 coaching sentences then: COACH OUTPUT: followed by valid JSON with keys summary, tiny_step, friction_to_remove, when_then_plan.',
    confidence:'You are a confidence and self-trust coach. Help the user identify evidence that they can handle their situation. Ask ONE question at a time. Avoid exaggerated affirmations. After 3 exchanges, output 1-2 coaching sentences then: COACH OUTPUT: followed by valid JSON with keys summary, evidence, confidence_line, practice_rep.',
    energy:'You are an energy-aware motivation coach. Help the user distinguish low energy, unclear priority, fear, and overwhelm. Suggest humane resets — not grind culture. Ask ONE question at a time. After 3 exchanges, output 1-2 coaching sentences then: COACH OUTPUT: followed by valid JSON with keys summary, likely_block, reset_tip, ten_minute_move.'
  },
  openers:{
    reframe:"Tell me what happened or what you\'re thinking, even if it feels messy. I\'ll help turn it into something usable.",
    stuck:"What are you avoiding, postponing, or circling around right now?",
    confidence:"What situation do you want to feel more confident about, and what part of it makes you doubt yourself?",
    energy:"What\'s your energy like today — tired body, overloaded mind, low mood, or unclear direction?"
  },
  outputLabels:{summary:'Coaching takeaway',positive_reframe:'Positive reframe',psychology_tip:'Psychology tip',next_step:'Next step',tiny_step:'Tiny step',friction_to_remove:'Friction to remove',when_then_plan:'When-then plan',evidence:'Evidence',confidence_line:'Confidence line',practice_rep:'Practice rep',likely_block:'Likely block',reset_tip:'Reset tip',ten_minute_move:'10-minute move'}
},
speaking:{
  icon:'ti-microphone-2', badge:'Speaking + Influence', title:'Speaking, Presentation & Influence Coach', tone:'card-ai',
  lede:'A communication coach for stronger speaking, presentation presence, influence, voice, story, and audience connection.',
  modes:[
    ['voice','ti-wave-sine','Voice polish','Pace, pause, pitch, resonance'],
    ['presentation','ti-presentation','Presentation plan','Structure and persuasive flow'],
    ['influence','ti-messages','Influence moment','Audience psychology and framing'],
    ['practice','ti-repeat','Practice drill','A focused speaking exercise']
  ],
  resources:[
    ['Vinh Giang','Communication and public speaking coach','https://www.vinhgiang.com/'],
    ['Julian Treasure at TED','Speaker on conscious listening and powerful speaking','https://www.ted.com/speakers/julian_treasure'],
    ['Amy Cuddy','Presence, body language, and confidence speaker','https://www.amycuddy.com/'],
    ['TED: Amy Cuddy Talk','Body language talk, with TED note about reproducibility debate','https://www.ted.com/talks/amy_cuddy_your_body_language_may_shape_who_you_are']
  ],
  systems:{
    voice:'You are a speaking coach helping the user improve voice, delivery, and presence. Draw from public-speaking principles: vocal variety, pace, pause, pitch, projection, articulation, and intentional silence. Ask ONE question at a time. When ready, output coaching sentences then: COACH OUTPUT: followed by valid JSON with keys summary, voice_focus, drill, line_to_practice.',
    presentation:'You are a presentation coach. Help the user build a clearer, more persuasive talk. Use audience-first structure, contrast, story, one core message, and a strong close. Ask ONE question at a time. When ready, output: COACH OUTPUT: followed by JSON with keys summary, core_message, structure, stronger_opening.',
    influence:'You are an ethical influence coach. Increase clarity, trust, credibility, emotional resonance — no manipulation. Use framing, social proof, cognitive load, and reciprocity responsibly. Ask ONE question at a time. When ready, output: COACH OUTPUT: followed by JSON with keys summary, audience_need, influence_move, ethical_guardrail.',
    practice:'You are a speaking practice coach. Give short drills for presence, articulation, pausing, storytelling, and concise answers. Ask ONE question at a time. When ready, output: COACH OUTPUT: followed by JSON with keys summary, drill, timing, self_review_prompt.'
  },
  openers:{
    voice:'What kind of speaking moment are you preparing for — meeting, presentation, video, interview, pitch, or difficult conversation?',
    presentation:'What is the presentation about, who is the audience, and what do you want them to do or believe afterward?',
    influence:'What are you trying to influence someone to understand, decide, support, or change?',
    practice:'What speaking skill do you want to practice today — clarity, confidence, vocal variety, storytelling, or concise answers?'
  },
  outputLabels:{summary:'Coaching takeaway',voice_focus:'Voice focus',drill:'Drill',line_to_practice:'Line to practice',core_message:'Core message',structure:'Structure',stronger_opening:'Stronger opening',audience_need:'Audience need',influence_move:'Influence move',ethical_guardrail:'Ethical guardrail',timing:'Timing',self_review_prompt:'Self-review'}
}};

var APP = COACHES[window.COACH_KIND] || COACHES.motivation;
var cMode = null, cHist = [];

/* ── Helpers ─────────────────────────────────────────────────────────────── */
function byId(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]}); }
function htmlText(s){ return esc(s).replace(/\n/g,'<br>'); }

async function callClaude(body){
  var d = await apiCall(body);
  if (d.error) throw new Error('api');
  return (d.content||[]).map(function(b){ return b.type==='text' ? b.text : ''; }).join('').trim();
}

/* ── Render ──────────────────────────────────────────────────────────────── */
function renderCoach(){
  var unlockedBanner = _mcUnlocked
    ? '<div class="card card-ok" style="margin-bottom:.875rem"><p class="sl sl-ok"><i class="ti ti-check"></i> Roadmap session unlocked</p><p style="font-size:13px;color:#A0E8C8;line-height:1.65">Your payment is confirmed. Choose a mode below — answer the questions honestly, and when you feel ready (usually 5–7 exchanges), hit <strong>Generate my roadmap</strong> to get your full personalized plan.</p></div>'
    : '';

  byId('app').innerHTML =
    '<div class="app">'+
    '<div class="topbar">'+
      '<div class="logo">'+
        '<img src="receipts_wordmark.png" alt="receipts." style="height:26px;display:block;flex-shrink:0">'+
        '<span class="version-badge"><i class="ti '+APP.icon+'" style="font-size:12px;vertical-align:-1px"></i> '+APP.badge+'</span>'+
      '</div>'+
      '<div style="display:flex;align-items:center;gap:8px">'+
        '<span class="privacy-pill"><i class="ti ti-shield-lock" style="font-size:13px"></i>Memory-only</span>'+
        '<a href="index.html" style="display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface2);font-size:12px;color:var(--text2);text-decoration:none;white-space:nowrap"><i class="ti ti-arrow-left" style="font-size:12px"></i> receipts.</a>'+
      '</div>'+
    '</div>'+

    unlockedBanner+

    '<div class="card '+APP.tone+'">'+
      '<p class="sl sl-ok"><i class="ti '+APP.icon+'"></i>'+APP.title+'</p>'+
      '<p class="lede">'+APP.lede+'</p>'+
    '</div>'+

    '<div class="g2" style="margin-bottom:1rem">'+
      APP.modes.map(function(m){
        return '<button class="coach-mode" onclick="startCoach(\''+m[0]+'\')">'+
          '<i class="ti '+m[1]+'" style="color:var(--teal)"></i>'+
          '<span>'+m[2]+'</span>'+
          '<span>'+m[3]+'</span>'+
          '</button>';
      }).join('')+
    '</div>'+

    '<div id="coach-idle" class="card" style="text-align:center;color:var(--text2);font-size:13px">Choose a coaching mode above to begin.</div>'+

    '<div id="coach-session" style="display:none">'+

      /* turn counter banner — outside input area so hiding input never hides it */
      (!_mcUnlocked
        ? '<div id="mc-turn-counter" style="display:none;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 12px;font-size:12px;color:var(--text2);justify-content:space-between;margin-bottom:.75rem;flex-wrap:wrap;gap:6px;align-items:center">'+
            '<span><i class="ti ti-info-circle" style="font-size:12px;vertical-align:-1px;color:var(--amber);margin-right:4px"></i>Free &mdash; <strong id="mc-turn-num" style="color:var(--amber)">0</strong> of 3 turns used</span>'+
            '<span style="font-size:11px;color:var(--text3)">Roadmap unlocks after turn 3</span>'+
          '</div>'
        : '')+

      /* messages */
      '<div id="coach-msgs" style="margin-bottom:8px"></div>'+

      /* input area — hidden when paywall shows or roadmap done */
      '<div id="mc-input-area">'+
        '<div class="fg" style="margin-bottom:7px">'+
          '<textarea id="coach-input" placeholder="Type your response here..." style="min-height:80px"></textarea>'+
        '</div>'+
        '<div style="display:flex;gap:7px">'+
          '<button class="btn-primary" onclick="sendCoach()" style="flex:1"><i class="ti ti-send" style="font-size:13px;vertical-align:-1px"></i> Send</button>'+
          '<button onclick="endCoach()">End session</button>'+
        '</div>'+
        /* roadmap CTA — shown after turn 5 in paid mode */
        '<div id="mc-roadmap-btn" style="display:none;margin-top:.625rem">'+
          '<button class="btn-teal" onclick="generateFullRoadmap()" style="width:100%;font-size:14px;padding:11px">'+
            '<i class="ti ti-map" style="font-size:14px;vertical-align:-1px"></i> Generate my roadmap &rarr;'+
          '</button>'+
          '<p style="font-size:11px;color:var(--text3);text-align:center;margin-top:5px">Or keep talking — click when you feel ready.</p>'+
        '</div>'+
      '</div>'+

      /* existing coach output */
      '<div id="coach-result" style="display:none;margin-top:.875rem">'+
        '<div class="card card-ok">'+
          '<p class="sl sl-ok"><i class="ti ti-check"></i> Coach output</p>'+
          '<div id="coach-out" style="font-size:13px;line-height:1.7;color:#A0E8C8"></div>'+
          '<div class="brow">'+
            '<button onclick="cpCoach()"><i class="ti ti-copy" style="font-size:12px;vertical-align:-1px"></i> Copy</button>'+
          '</div>'+
        '</div>'+
      '</div>'+

      /* ── FREE TIER: mini preview ── */
      '<div id="mc-mini-preview" style="display:none;margin-top:.875rem">'+
        '<div class="card card-ok">'+
          '<p class="sl sl-ok"><i class="ti ti-eye"></i> Your preview — 1 concrete step</p>'+
          '<div id="mc-mini-out" style="font-size:13px;line-height:1.7;color:#A0E8C8"></div>'+
          '<div class="brow" style="margin-top:10px">'+
            '<button onclick="cpMini()"><i class="ti ti-copy" style="font-size:12px;vertical-align:-1px"></i> Copy preview</button>'+
          '</div>'+
        '</div>'+
      '</div>'+

      /* ── FREE TIER: paywall ── */
      '<div id="mc-paywall" style="display:none;margin-top:.875rem">'+
        '<div class="card-pay">'+
          '<p style="font-size:24px;margin-bottom:.5rem">🗺️</p>'+
          '<p style="font-size:16px;font-weight:700;margin-bottom:.5rem;color:var(--text)">Get your full personal roadmap</p>'+

/* ── Start coaching session ─────────────────────────────────────────────── */
async function startCoach(mode){
  cMode = mode; cHist = []; _coachTurns = 0; _miniShown = false; _roadmapDone = false;
  byId('coach-idle').style.display = 'none';
  byId('coach-session').style.display = 'block';
  byId('coach-result').style.display = 'none';
  byId('mc-mini-preview').style.display = 'none';
  byId('mc-paywall').style.display = 'none';
  byId('mc-roadmap-result').style.display = 'none';
  byId('mc-roadmap-btn').style.display = 'none';
  byId('chat-export').style.display = 'none';
  byId('mc-input-area').style.display = 'block';
  /* show turn counter immediately */
  var tc0 = byId('mc-turn-counter');
  if (tc0) { tc0.style.display = 'flex'; }
  var tn0 = byId('mc-turn-num');
  if (tn0) tn0.textContent = '0';

  byId('coach-msgs').innerHTML = '<div class="cmsg cmai"><span class="spin"></span>Starting session...</div>';

  try {
    var txt = await callClaude({
      model:'claude-sonnet-4-6', max_tokens:200,
      system: APP.systems[mode],
      messages:[{role:'user', content:'Begin the coaching session.'}]
    });
    if (!txt) throw new Error('empty');
    cHist = [{role:'user',content:'Begin.'},{role:'assistant',content:txt}];
    byId('coach-msgs').innerHTML = '<div class="cmsg cmai">'+htmlText(txt)+'</div>';
  } catch(e) {
    var op = APP.openers[mode];
    cHist = [{role:'assistant',content:op}];
    byId('coach-msgs').innerHTML = '<div class="cmsg cmai">'+htmlText(op)+'</div>';
  }
}

/* ── Send message ───────────────────────────────────────────────────────── */
async function sendCoach(){
  var input = byId('coach-input').value.trim();
  if (!input || !cMode) return;
  byId('coach-input').value = '';
  var msgs = byId('coach-msgs');
  msgs.innerHTML += '<div class="cmsg">'+htmlText(input)+'</div>'+
    '<div class="cmsg cmai" id="ctyping"><span class="spin"></span>Thinking...</div>';
  cHist.push({role:'user', content:input});

  try {
    var txt = await callClaude({
      model:'claude-sonnet-4-6', max_tokens:750,
      system: APP.systems[cMode],
      messages: cHist
    });
    if (!txt) throw new Error('empty');
    cHist.push({role:'assistant', content:txt});
    var ct = byId('ctyping'); if (ct) ct.remove();
    handleCoachText(txt, msgs);
    byId('chat-export').style.display = 'block';
  } catch(e) {
    var ct2 = byId('ctyping'); if (ct2) ct2.remove();
    var hist = cHist.map(function(m){ return (m.role==='user'?'You: ':'Coach: ')+m.content; }).join('\n\n');
    var prompt = 'I am using a '+APP.title+' tool. Continue this coaching conversation in the same style. Ask one question at a time.\n\n'+hist;
    msgs.innerHTML += '<div class="cmsg cmai" style="background:var(--amber-dim);border-color:var(--amber-b);color:#F5D79E">API unavailable. Copy this prompt and paste into Claude.ai.</div>'+
      '<div class="dpre">'+esc(prompt)+'</div>';
  }

  /* turn tracking */
  _coachTurns++;

  /* update visible counter */
  if (!_mcUnlocked) {
    var tcEl = byId('mc-turn-counter');
    var tnEl = byId('mc-turn-num');
    if (tcEl) tcEl.style.display = 'flex';
    if (tnEl) tnEl.textContent = Math.min(_coachTurns, 3);
  }

  /* free mode: after turn 3, show paywall immediately, fill preview in background */
  if (!_mcUnlocked && _coachTurns >= 3 && !_miniShown) {
    _miniShown = true;
    byId('mc-input-area').style.display = 'none';
    byId('mc-mini-preview').style.display = 'block';
    byId('mc-paywall').style.display = 'block';
    generateMiniPreview();   /* fills preview content async — no longer controls visibility */
    /* scroll paywall into view */
    setTimeout(function(){ var pw = byId('mc-paywall'); if (pw) pw.scrollIntoView({behavior:'smooth',block:'start'}); }, 100);
    return;
  }

  /* paid mode: after turn 5, show roadmap CTA */
  if (_mcUnlocked && _coachTurns >= 5 && !_roadmapDone) {
    byId('mc-roadmap-btn').style.display = 'block';
  }
}

/* ── Handle COACH OUTPUT ────────────────────────────────────────────────── */
function handleCoachText(txt, msgs){
  var clean = txt.replace(/\*\*COACH OUTPUT:\*\*/gi,'COACH OUTPUT:');
  if (clean.indexOf('COACH OUTPUT:') < 0) {
    msgs.innerHTML += '<div class="cmsg cmai">'+htmlText(txt)+'</div>';
    return;
  }
  var parts = clean.split(/COACH OUTPUT:/i);
  var conversational = parts[0].trim();
  var raw = parts.slice(1).join('COACH OUTPUT:').trim();
  var parsed = {};
  try { var jm = raw.match(/\{[\s\S]*\}/); if (jm) parsed = JSON.parse(jm[0]); } catch(e) {}
  msgs.innerHTML += '<div class="cmsg cmai">'+htmlText(parsed.summary || conversational || raw)+'</div>';
  var out = '';
  Object.keys(APP.outputLabels).forEach(function(k){
    if (parsed[k]) out += '<strong>'+APP.outputLabels[k]+':</strong> '+esc(parsed[k])+'<br>';
  });
  if (!out) out = htmlText(conversational+'\n\n'+raw);
  byId('coach-result').style.display = 'block';
  byId('coach-out').innerHTML = out;
}

/* ── End session ────────────────────────────────────────────────────────── */
function endCoach(){
  byId('coach-session').style.display = 'none';
  byId('coach-idle').style.display = 'block';
  byId('coach-result').style.display = 'none';
  byId('chat-export').style.display = 'none';
  cMode = null; cHist = []; _coachTurns = 0; _miniShown = false; _roadmapDone = false;
}

/* ── Copy coach output ──────────────────────────────────────────────────── */
function cpCoach(){
  var t = byId('coach-out');
  navigator.clipboard.writeText(t ? (t.textContent||'') : '').catch(function(){});
  if (t) { t.style.outline = '1px solid var(--green)'; setTimeout(function(){ t.style.outline=''; },1200); }
}

/* ── MINI PREVIEW (free tier) ───────────────────────────────────────────── */
async function generateMiniPreview(){
  /* visibility already set by sendCoach — just fill content */
  var out = byId('mc-mini-out');
  if (!out) return;
  out.innerHTML = '<span class="spin"></span> Analyzing your session...';

  var previewSystem = 'Based on this coaching conversation, create a brief honest preview of the user\'s situation. Be specific to exactly what they said — no generic advice. Output ONLY: MINI_PREVIEW: followed by valid JSON with exactly these keys: insight (1 sentence about their core situation or block, completely specific to what they actually said), first_step (one very concrete action they could take TODAY — must be specific to their situation, no filler words, no fluff), teaser (1 sentence describing what a full 3-week personalized roadmap would help them accomplish, specific to their goal). No other text. No markdown.';

  var previewMessages = cHist.concat([{
    role:'user',
    content:'Based on everything I\'ve shared, give me a brief preview of my situation and one concrete first step.'
  }]);

  try {
    var txt = await callClaude({
      model:'claude-sonnet-4-6', max_tokens:320,
      system: previewSystem,
      messages: previewMessages
    });
    var parsed = {};
    try {
      var clean = txt.replace(/MINI_PREVIEW:/i,'').replace(/```json/g,'').replace(/```/g,'').trim();
      var m = clean.match(/\{[\s\S]*\}/);
      if (m) parsed = JSON.parse(m[0]);
    } catch(e) {}

    var html = '';
    if (parsed.insight) {
      html += '<p style="font-size:13px;color:#A0E8C8;line-height:1.65;margin-bottom:.75rem">'+
        '<strong>Your situation:</strong> '+esc(parsed.insight)+'</p>';
    }
    if (parsed.first_step) {
      html += '<p style="font-size:13px;color:#A0E8C8;line-height:1.65;margin-bottom:.75rem">'+
        '<strong>One step you can take today:</strong> '+esc(parsed.first_step)+'</p>';
    }
    if (parsed.teaser) {
      html += '<p style="font-size:12px;color:var(--text2);line-height:1.5;border-top:1px solid var(--green-b);padding-top:.625rem;margin-top:.25rem;font-style:italic">'+esc(parsed.teaser)+'</p>';
    }
    if (!html) {
      html = '<p style="font-size:13px;color:#A0E8C8;line-height:1.65">'+esc(txt.replace(/MINI_PREVIEW:/i,'').trim())+'</p>';
    }
    out.innerHTML = html;
  } catch(e) {
    out.innerHTML = '<p style="font-size:13px;color:#A0E8C8;line-height:1.65">Based on your session, you have a clear starting point. Unlock your full roadmap for concrete week-by-week actions tailored to exactly what you shared.</p>';
  }

  /* paywall already shown by sendCoach before this async call */
}

/* ── Stripe checkout ─────────────────────────────────────────────────────── */
function mcCheckout(){
  var emailEl = byId('mc-pay-email');
  var email = emailEl ? emailEl.value.trim() : '';
  var url = STRIPE_MC.plan;
  if (email && email.indexOf('@') > 0) {
    url += (url.indexOf('?') > 0 ? '&' : '?') + 'prefilled_email=' + encodeURIComponent(email);
  }
  window.open(url, '_blank');
}

/* ── FULL ROADMAP GENERATION (paid tier) ────────────────────────────────── */
async function generateFullRoadmap(){
  _roadmapDone = true;
  byId('mc-roadmap-btn').style.display = 'none';
  byId('mc-input-area').style.display = 'none';

  var rr = byId('mc-roadmap-result');
  rr.style.display = 'block';
  rr.innerHTML =
    '<div class="card card-ok">'+
      '<p class="sl sl-ok"><i class="ti ti-map"></i> Building your roadmap...</p>'+
      '<div style="text-align:center;padding:1.5rem">'+
        '<span class="spin" style="width:18px;height:18px;border-width:3px;margin-right:0"></span>'+
        '<p style="font-size:12px;color:var(--text2);margin-top:.75rem">Analyzing your conversation and generating a concrete plan...</p>'+
      '</div>'+
    '</div>';

  var roadmapSystem = 'You are a personal action planning coach generating a paid deliverable. Based on this coaching conversation, create a concrete, specific, practical 3-week personal roadmap. CRITICAL RULES: (1) Every single item must reference something the person actually said. (2) Zero generic advice — if you catch yourself writing something that could apply to anyone, rewrite it. (3) Be specific about timing, context, and method. (4) Real resources only — real URLs that work. Output ONLY: ROADMAP: followed by valid JSON with exactly these keys: goal_statement (their specific goal in one clear direct sentence based on what they shared), week_1 (array of exactly 3 strings — specific daily actions, format each as "Days X-X: [specific action tied to their situation]"), week_2 (array of exactly 3 strings — actions that build on week 1, still specific to their context), week_3_plus (array of exactly 3 strings — longer-term moves or habits grounded in their situation), accountability (one specific measurable thing they will check each week — not vague), obstacles (array of exactly 2 objects, each with keys blocker and workaround — both must be specific to what they shared, not generic), resources (array of exactly 2 objects, each with keys name, reason, url — must be real working URLs directly relevant to their exact situation). No text outside the JSON. No markdown.';

  var roadmapMessages = cHist.concat([{
    role:'user',
    content:'I am ready for my full personal roadmap. Please generate it now based on everything we discussed.'
  }]);

  try {
    var txt = await callClaude({
      model:'claude-sonnet-4-6', max_tokens:1400,
      system: roadmapSystem,
      messages: roadmapMessages
    });
    var parsed = {};
    try {
      var clean = txt.replace(/ROADMAP:/i,'').replace(/```json/g,'').replace(/```/g,'').trim();
      var m = clean.match(/\{[\s\S]*\}/);
      if (m) parsed = JSON.parse(m[0]);
    } catch(e) {}

    renderRoadmap(parsed, txt);
    byId('chat-export').style.display = 'block';
  } catch(e) {
    /* fallback: surface as copyable prompt */
    var hist = cHist.map(function(m){ return (m.role==='user'?'Me: ':'Coach: ')+m.content; }).join('\n\n');
    rr.innerHTML =
      '<div class="card card-warn">'+
        '<p class="sl sl-warn"><i class="ti ti-alert-triangle"></i> API unavailable — copy fallback prompt</p>'+
        '<p style="font-size:12px;color:var(--text2);line-height:1.6;margin-bottom:.75rem">Paste this into Claude.ai to get your roadmap.</p>'+
        '<div class="dpre">Based on this coaching conversation, generate my concrete 3-week personal roadmap with specific daily actions, accountability check-ins, likely obstacles with workarounds, and real resources:\n\n'+esc(hist)+'</div>'+
      '</div>';
  }
}

/* ── Render roadmap card ─────────────────────────────────────────────────── */
function renderRoadmap(p, raw){
  var rr = byId('mc-roadmap-result');
  if (!rr) return;

  if (!p.goal_statement) {
    /* parsing failed — show raw */
    rr.innerHTML =
      '<div class="card card-ok">'+
        '<p class="sl sl-ok"><i class="ti ti-map"></i> Your roadmap</p>'+
        '<div class="dpre" style="max-height:500px">'+esc(raw)+'</div>'+
        '<div class="brow"><button onclick="dlRoadmap()"><i class="ti ti-download" style="font-size:12px;vertical-align:-1px"></i> Download .txt</button></div>'+
      '</div>';
    return;
  }

  function sectionLabel(text, color){
    return '<p class="section-label" style="color:'+color+'">'+esc(text)+'</p>';
  }

  function weekItems(arr){
    if (!arr || !arr.length) return '';
    return arr.map(function(item){
      return '<div class="week-item">'+esc(item)+'</div>';
    }).join('');
  }

  var html =
    '<div class="card card-ok">'+
      '<p class="sl sl-ok"><i class="ti ti-map"></i> Your personal roadmap</p>'+
      '<p style="font-size:14px;font-weight:600;color:var(--text);line-height:1.55;margin-bottom:1.125rem;padding-bottom:1rem;border-bottom:1px solid var(--green-b)">'+esc(p.goal_statement)+'</p>';

  /* weeks */
  if (p.week_1 && p.week_1.length) {
    html += sectionLabel('Week 1', 'var(--green)');
    html += weekItems(p.week_1);
  }
  if (p.week_2 && p.week_2.length) {
    html += sectionLabel('Week 2', 'var(--green)');
    html += weekItems(p.week_2);
  }
  if (p.week_3_plus && p.week_3_plus.length) {
    html += sectionLabel('Week 3 and beyond', 'var(--teal)');
    html += p.week_3_plus.map(function(item){
      return '<div style="background:var(--teal-dim);border:1px solid var(--teal-b);border-radius:var(--radius-sm);padding:8px 12px;font-size:13px;color:var(--text);line-height:1.55;margin-bottom:5px">'+esc(item)+'</div>';
    }).join('');
  }

  /* accountability */
  if (p.accountability) {
    html += sectionLabel('Weekly accountability check', 'var(--amber)');
    html += '<div style="background:var(--amber-dim);border:1px solid var(--amber-b);border-radius:var(--radius-sm);padding:8px 12px;font-size:13px;color:var(--text);line-height:1.55;margin-bottom:5px">'+esc(p.accountability)+'</div>';
  }

  /* obstacles */
  if (p.obstacles && p.obstacles.length) {
    html += sectionLabel('Likely obstacles + workarounds', 'var(--red)');
    p.obstacles.forEach(function(ob){
      html += '<div class="obstacle-item">'+
        '<span style="color:var(--text);font-weight:600">'+esc(ob.blocker||'')+'</span>';
      if (ob.workaround) html += '<br><span style="color:var(--text2)">&#8594; '+esc(ob.workaround)+'</span>';
      html += '</div>';
    });
  }

  /* resources */
  if (p.resources && p.resources.length) {
    html += sectionLabel('Resources', 'var(--blue)');
    p.resources.forEach(function(res){
      var url = res.url || '#';
      html += '<a href="'+esc(url)+'" target="_blank" rel="noopener" class="resource-item">'+
        '<span style="font-weight:600;color:var(--text)">'+esc(res.name||url)+'</span>';
      if (res.reason) html += '<br><span style="color:var(--text2);font-size:12px">'+esc(res.reason)+'</span>';
      html += '</a>';
    });
  }

  /* actions */
  html +=
    '<div class="brow" style="margin-top:1rem">'+
      '<button onclick="cpRoadmap()"><i class="ti ti-copy" style="font-size:12px;vertical-align:-1px"></i> Copy roadmap</button>'+
      '<button onclick="dlRoadmap()"><i class="ti ti-download" style="font-size:12px;vertical-align:-1px"></i> Download .txt</button>'+
    '</div>'+
    '<p style="font-size:10px;color:var(--text3);margin-top:.625rem;line-height:1.5">Generated from your coaching conversation. This is self-reported context processed by AI — not professional career, legal, medical, or financial advice.</p>'+
    '</div>';

  rr.innerHTML = html;
}

/* ── Copy / download roadmap ────────────────────────────────────────────── */
function cpRoadmap(){
  var el = byId('mc-roadmap-result');
  navigator.clipboard.writeText(el ? (el.textContent||'') : '').catch(function(){});
  if (el) { el.style.outline = '1px solid var(--green)'; setTimeout(function(){ el.style.outline=''; },1200); }
}

function dlRoadmap(){
  var el = byId('mc-roadmap-result');
  var text = el ? (el.textContent||'') : '';
  var blob = new Blob([text],{type:'text/plain'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'receipts-roadmap-'+new Date().toISOString().slice(0,10)+'.txt';
  a.click();
  URL.revokeObjectURL(url);
}

/* ── Chat log ───────────────────────────────────────────────────────────── */
function makeCoachLog(){
  var mode = cMode || 'session';
  var lines = [
    '================================================',
    '  receipts.  |  Coaching Session Log',
    '  Mode: '+mode,
    '  Generated: '+new Date().toLocaleDateString()+' '+new Date().toLocaleTimeString(),
    '================================================',''
  ];
  cHist.forEach(function(m){
    if (m.role==='user' && m.content==='Begin.') return;
    var label = m.role==='user' ? 'YOU' : 'COACH';
    lines.push('-- '+label+' '+'-'.repeat(Math.max(1,44-label.length)));
    lines.push(m.content);
    lines.push('');
  });
  lines.push('================================================');
  lines.push('  Note: AI coaching session. Not professional career,');
  lines.push('  legal, medical, or financial advice.');
  lines.push('================================================');
  return lines.join('\n');
}

function copyCoachLog(){
  var log = makeCoachLog();
  navigator.clipboard.writeText(log).catch(function(){});
  var btn = byId('chat-export');
  if (btn) { btn.style.outline='1px solid var(--green)'; setTimeout(function(){ btn.style.outline=''; },1400); }
}

function downloadCoachLog(){
  var log = makeCoachLog();
  var blob = new Blob([log],{type:'text/plain'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'receipts-coaching-'+new Date().toISOString().slice(0,10)+'.txt';
  a.click();
  URL.revokeObjectURL(url);
}

/* ── Init ───────────────────────────────────────────────────────────────── */
renderCoach();
